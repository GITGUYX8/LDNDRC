apiVersion: apps/v1
kind: Deployment
metadata:
  name: ldndrc-control-panel
  namespace: ldndrc
  labels:
    app.kubernetes.io/name: ldndrc-control-panel
    app.kubernetes.io/part-of: ldndrc
spec:
  replicas: 1
  # hostNetwork pod binds :8082 on the node. A surge pod would fight the
  # old pod for the port and deadlock forever (seen live, CP-20 §6), so
  # rollouts must delete-old-first: maxSurge 0 scales the old RS down
  # before the new pod is created.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ldndrc-control-panel
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ldndrc-control-panel
        app.kubernetes.io/part-of: ldndrc
    spec:
      serviceAccountName: ldndrc-control-panel
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: control-panel
          image: ldndrc/control-panel:dev
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          env:
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: ldndrc-control-panel
                  key: JWT_SECRET
            - name: KUBERNETES_IN_CLUSTER
              value: "true"
            - name: SESSION_NAMESPACE
              value: ldndrc
            - name: COOKIE_DOMAIN
              value: .ros-platform.local
            - name: GATEWAY_HOST_SUFFIX
              value: ros-platform.local
            # R6: sessions run the real Jazzy/Harmonic workspace image
            # (immutable :jazzy-harmonic-<sha> tag, never :latest). The
            # 82MB demo stand-in remains available for k3d demo clusters
            # via a local override: ldndrc/demo-standin:dev.
            # Selkies 2.0.0 streams the desktop (see CP-34/35); GPU stays
            # "0" (CPU-only) until the nvidia device-plugin follow-up.
            - name: SESSION_IMAGE
              value: ldndrc/ros2-gz:jazzy-harmonic-10f1f10c
            - name: SESSION_HOME_STORAGE
              value: 5Gi
            # Demo-cluster value: the k3d node has no GPU, so sessions omit
            # the nvidia.com/gpu request and can schedule. Production
            # Hosts use "1".
            - name: SESSION_GPU_LIMIT
              value: "0"
            # Nodes onboarding DB (P1): on the panel PVC (R2-final), so
            # approvals survive pod redeploys.
            - name: NODES_DB
              value: /var/lib/ldndrc/nodes.json
            # Session records (R2): JSON beside NODES_DB, same PVC.
            # On boot the panel reconciles loaded records against live
            # Deployments: existing adopted, missing tombstoned to stopped.
            - name: SESSIONS_DB
              value: /var/lib/ldndrc/sessions.json
            # Public K3s join URL handed to approved laptops. Must match
            # the master's current LAN address — this laptop's DHCP lease
            # drifts (CP-42: .37 → .65 → .42); a router DHCP reservation
            # is the standing fix.
            - name: K3S_JOIN_URL
              value: "https://192.168.1.42:6443"
            # Real master value: the pod runs on the host network (see
            # control-panel-hostnetwork-patch.yaml) so LAN multicast is
            # reachable and announcements escape to joining laptops.
            - name: ADVERTISE_MDNS
              value: "true"
            - name: CONTROL_PANEL_PORT
              value: "8082"
          ports:
            - name: http
              containerPort: 8082
          volumeMounts:
            - name: data
              mountPath: /var/lib/ldndrc
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
              # hostNetwork pod: pin loopback so probes survive host IP
              # churn. Default (podIP) was baked in at pod creation and
              # went stale on DHCP drift → 141-restart crashloop storm
              # (CP-42). The panel listens on all interfaces, including
              # the node's loopback.
              host: 127.0.0.1
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
              host: 127.0.0.1
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 2
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
      volumes:
        # PVC (R2-final): node DBs must survive pod redeploys, not just
        # container restarts. Replacing the emptyDir swapped away the
        # old nodes.json contents — approved laptops re-join via the
        # join TUI (CP-42).
        - name: data
          persistentVolumeClaim:
            claimName: ldndrc-control-panel-data
