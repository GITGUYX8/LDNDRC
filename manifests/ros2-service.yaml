# ros2-platform Service: stable ClusterIP with three named ports, one per
# browser tool. Sticky sessions (ClientIP, 1h) keep a guest laptop pinned to
# its own workspace pod across multiple HTTP/WebSocket requests.
apiVersion: v1
kind: Service
metadata:
  name: ros2-platform-svc
  labels:
    app.kubernetes.io/name: ros2-platform-svc
    app.kubernetes.io/part-of: ldndrc
spec:
  type: ClusterIP
  sessionAffinity: ClientIP
  sessionAffinityConfig:
    clientIP:
      timeoutSeconds: 3600
  selector:
    app: ros2-platform
  ports:
    - name: editor
      port: 7682
      targetPort: editor
    - name: desktop
      port: 8080
      targetPort: desktop
    - name: gzweb
      port: 9002
      targetPort: gzweb