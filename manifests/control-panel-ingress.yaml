# Reference-aligned host routing. The legacy path-based ros2-ingress.yaml
# (/code, /stream, /sim on the bare hostname) was removed after these host
# routes were verified live (checkpoint-13).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ldndrc-control-panel
  namespace: ldndrc
  labels:
    app.kubernetes.io/name: ldndrc-control-panel
    app.kubernetes.io/part-of: ldndrc
spec:
  ingressClassName: traefik
  rules:
    - host: control.ros-platform.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ldndrc-control-panel
                port:
                  name: http
    - host: editor.ros-platform.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ldndrc-control-panel
                port:
                  name: http
    - host: desktop.ros-platform.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ldndrc-control-panel
                port:
                  name: http
    - host: gazebo.ros-platform.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ldndrc-control-panel
                port:
                  name: http
