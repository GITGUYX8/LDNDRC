# ros2-platform Ingress: guest-browser entry point, mirroring the proven
# test-ingress pattern (host ros-platform.local -> k3d loadbalancer -> Traefik).
#
#   /code    -> code-server editor        (7682)
#   /stream  -> Selkies desktop stream    (8080)
#   /sim     -> Gazebo websocket bridge   (9002)
#
# The /sim viewer page itself is served by the control panel (Phase 5) which
# proxies the websocket to the pod's 9002 bridge. Traefik upgrades the HTTP
# request to a websocket transparently for ws:// subscribers on /sim.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ros2-platform-ingress
  labels:
    app.kubernetes.io/name: ros2-platform-ingress
    app.kubernetes.io/part-of: ldndrc
spec:
  rules:
    - host: ros-platform.local
      http:
        paths:
          - path: /code
            pathType: Prefix
            backend:
              service:
                name: ros2-platform-svc
                port:
                  number: 7682
          - path: /stream
            pathType: Prefix
            backend:
              service:
                name: ros2-platform-svc
                port:
                  number: 8080
          - path: /sim
            pathType: Prefix
            backend:
              service:
                name: ros2-platform-svc
                port:
                  number: 9002