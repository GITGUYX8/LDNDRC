[supervisord]
nodaemon=true
pidfile=/tmp/supervisord.pid
logfile=/tmp/supervisord.log
logfile_maxbytes=0

[unix_http_server]
file=/tmp/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

[program:code-server]
command=/usr/local/bin/start-code-server
priority=20
autorestart=true
startsecs=2
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

# [program:selkies] removed while Selkies is deferred (WITH_SELKIES=0):
# without the package installed, supervisord would restart-loop the missing
# start-selkies. The 2.0.0 migration chunk restores this section.
# (start-selkies.sh stays in-tree for that migration.)

[program:gazebo-web]
command=/usr/local/bin/start-gazebo-web
priority=30
autorestart=true
startsecs=2
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
